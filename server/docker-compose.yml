services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U user -d db"]
      # interval: 10s
      # timeout: 5s
      # retries: 5
      # start_period: 10s
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    platform: linux/amd64
    command:
      - --model
      - /models/Llama-3.2-1B-Instruct-Q4_0.gguf
      - --port
      - "8000"
      - --ctx-size
      - "32768"
    volumes:
      - ../models:/models:ro
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  # app:
  #   build: .
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     llm:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgres://user:pass@db:5432/db?sslmode=disable
