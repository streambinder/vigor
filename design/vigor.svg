<?xml version="1.0" encoding="UTF-8"?>
<!--
  VIGOR LOGO - BOLD CONIC (TRANSPARENT)
  For use on any background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Vigor - Bold Conic</title>
  <defs>
    <linearGradient id="boldConic" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#2B4C5D"/>
      <stop offset="35%" stop-color="#E65D38"/>
      <stop offset="70%" stop-color="#8F1D21"/>
      <stop offset="100%" stop-color="#2B4C5D"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#boldConic)" stroke-width="14"/>
</svg>
