<?xml version="1.0" encoding="UTF-8"?>
<!--
  VIGOR LOGO - GREYSCALE (COCKPIT VERSION)
  Monochrome gradient, transparent background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Vigor - Greyscale</title>
  <defs>
    <linearGradient id="greyGradient" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="35%" stop-color="#888C94"/>
      <stop offset="70%" stop-color="#5A5A5A"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#greyGradient)" stroke-width="14"/>
</svg>
