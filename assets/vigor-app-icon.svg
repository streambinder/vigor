<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- primary gradient -->
    <linearGradient id="vigorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
    </linearGradient>
    <!-- trail gradients with fade -->
    <linearGradient id="trailLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="trailRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0.6"/>
    </linearGradient>
    <!-- glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#0F0F0F"/>

  <!-- energy trails (motion blur effect) -->
  <g filter="url(#softGlow)">
    <!-- left trail -->
    <path fill="url(#trailLeft)" d="
      M 120 200
      L 260 200
      L 490 680
      L 440 680
      Z
    " opacity="0.5"/>
    <path fill="url(#trailLeft)" d="
      M 160 220
      L 280 220
      L 500 680
      L 460 680
      Z
    " opacity="0.3"/>
    <!-- right trail -->
    <path fill="url(#trailRight)" d="
      M 904 200
      L 764 200
      L 534 680
      L 584 680
      Z
    " opacity="0.5"/>
    <path fill="url(#trailRight)" d="
      M 864 220
      L 744 220
      L 524 680
      L 564 680
      Z
    " opacity="0.3"/>
  </g>

  <!-- main V shape - bold, angular, dynamic -->
  <g filter="url(#glow)">
    <path fill="url(#vigorGradient)" d="
      M 220 200
      L 340 200
      L 512 640
      L 684 200
      L 804 200
      L 580 780
      L 444 780
      Z
    "/>
  </g>

  <!-- speed accent lines -->
  <g stroke="url(#vigorGradient)" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="180" y1="320" x2="240" y2="320"/>
    <line x1="160" y1="380" x2="200" y2="380"/>
    <line x1="140" y1="440" x2="180" y2="440"/>
    <line x1="844" y1="320" x2="784" y2="320"/>
    <line x1="864" y1="380" x2="824" y2="380"/>
    <line x1="884" y1="440" x2="844" y2="440"/>
  </g>

  <!-- energy spark at apex -->
  <g filter="url(#softGlow)">
    <circle cx="512" cy="720" r="16" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="512" cy="720" r="24" fill="url(#vigorGradient)" opacity="0.4"/>
  </g>
</svg>
