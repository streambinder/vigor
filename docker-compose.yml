---
services:
  database:
    image: pgvector/pgvector:0.8.1-pg18
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U user -d db"]
    networks:
      - default
  embedding:
    image: michaelf34/infinity:0.0.75
    command:
      - v2
      - --model-id
      - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    environment:
      DO_NOT_TRACK: 1
    volumes:
      - hf_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /model.gguf
    volumes:
      - ./models/model.gguf:/model.gguf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  knowledge:
    build:
      context: .
      dockerfile: knowledge/Dockerfile
    depends_on:
      embedding:
        condition: service_healthy
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      INFINITY_TIERS: http://embedding:7997
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U user -d db"]
    networks:
      - default
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      embedding:
        condition: service_healthy
      # llm:
      #   condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgres://user:pass@database:5432/db?sslmode=disable
      KNOWLEDGE_URL: postgres://user:pass@knowledge:5432/db?sslmode=disable
      JWT_SECRET: 123456789
      LLAMACPP_TIERS: http://llm:8080
      INFINITY_TIERS: http://embedding:7997
      OPENROUTER_API_KEY: sk-or-v1-blablabla
      OPENROUTER_MODEL: openai/gpt-oss-20b:free
      GOOGLE_CLIENT_ID: 123123123-abcedfghilmnopqrstuvz.apps.googleusercontent.com
    networks:
      - default
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8000
      BUILD_VERSION: ${BUILD_VERSION:-dev}
    ports:
      - 8080:80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
  cockpit:
    build:
      context: ./cockpit
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://user:pass@database:5432/db?sslmode=disable
      KNOWLEDGE_URL: postgres://user:pass@knowledge:5432/db?sslmode=disable
      # METRICS_URL: /data/metrics.db
      USER: admin
      PASSWORD: admin
    ports:
      - 8081:8080
    # volumes:
    #   - ./metrics.db:/data/metrics.db:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

volumes:
  db_data:
  hf_cache:

networks:
  default:
