name: vigor
description: Vigor mobile application for fitness training management
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.1
  http: ^1.6.0
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.9.0
  uuid: ^4.5.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  logger: ^2.0.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.10
  image_picker: ^1.1.2
  app_links: ^6.3.3
  share_plus: ^12.0.2
  health: ^13.3.1
  flutter_timezone: ^5.1.0
  flutter_markdown: ^0.7.4+1
  permission_handler: ^12.0.1
  flutter_web_plugins:
    sdk: flutter
  google_sign_in_platform_interface: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.11.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/audio/
    - assets/body_front.svg
    - assets/body_back.svg
    - assets/body_front_female.svg
    - assets/body_back_female.svg

  fonts:
    # Space Grotesk — Headlines, branding (IDENTITY.md section 3.3)
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

    # Inter — Body text, instructions (IDENTITY.md section 3.3)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    # JetBrains Mono — Data, timers, scores (IDENTITY.md section 3.3)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
