name: vigor
description: Vigor mobile application for fitness training management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP client
  http: ^1.1.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # JSON serialization
  json_annotation: ^4.8.1

  # UUID generation
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
