server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable cache for index.html (always revalidate entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Disable cache for runtime config (environment variables injected at startup)
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "-1";
    }

    # Short-lived cache for JS/CSS (5 minutes to allow faster update propagation)
    # assumes flutter build web --release generates content-hashed filenames
    location ~* \.(js|css)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Medium-lived cache for images (7 days, less critical for updates)
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Medium-lived cache for fonts (7 days, rarely change)
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable logging for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Deep link verification files (iOS AASA + Android asset links)
    location /.well-known/ {
        add_header Content-Type application/json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Shared training OG meta tags — proxy to backend only for social crawlers
    # so they get dynamic og:title/og:description. Regular browsers get the
    # SPA (which handles /t/ routes client-side via the fallback block below).
    location /t/ {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|TelegramBot|Discordbot|Googlebot|bingbot|Applebot)") {
            set $crawler 1;
        }

        # non-crawler browsers: serve the SPA
        if ($crawler = 0) {
            rewrite ^ /index.html last;
        }

        # crawler path: proxy to backend for OG tags
        resolver ${DNS_RESOLVER} valid=10s;
        set $backend ${API_INTERNAL_URL};
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main location block (SPA routing fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
