---
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/backend"
      - "/backend/tools/codegen"
      - "/cockpit"
      - "/knowledge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25
    groups:
      gomod:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pub:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/backend"
      - "/cockpit"
      - "/knowledge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        update-types:
          - "minor"
          - "patch"
