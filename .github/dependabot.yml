---
version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/backend"
      - "/backend/tools/codegen"
      - "/cockpit"
      - "/knowledge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    open-pull-requests-limit: 25

  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/backend"
      - "/cockpit"
      - "/knowledge"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
