---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  # push: null
  # pull_request: null

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

env:
  DOCKER_PLATFORMS: linux/arm64,linux/amd64

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579
        with:
          check_filenames: true
          skip: knowledge/features/exercises.json
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/* ./
      - uses: super-linter/super-linter/slim@2bdd90ed3262e023ac84bf8fe35dc480721fc1f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_GO: false
  gofumpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          if gofumpt -l -e backend knowledge | grep '^' -q; then exit 1; fi
  go-channel-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'make\(chan\s')" = "$(grep -Erc --include='*.go' --exclude-dir=".git*" '\sclose\(')"
  go-http-body-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -rc --include='*.go' --exclude-dir=".git*" 'http.Get(\|http.Head(\|http.DefaultClient.Do(')" = "$(grep -rc --include='*.go' --exclude-dir=".git*" '.Body.Close()')"
  go-mockey-unpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -cr --include='*.go' 'mockey.Mock(')" = "$(grep -cr --include='*.go' '\.UnPatch()$')"
  go-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd backend
          go generate
          git diff --exit-code
  dart-build-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code
  flutter-build:
    runs-on: ubuntu-latest
    needs: [codespell, super-linter, dart-build-runner]
    if: success()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter build apk --debug
  app-docker:
    runs-on: ubuntu-latest
    needs: [flutter-build]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: app
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/app:latest
          push: ${{ github.event_name != 'pull_request' }}
  knowledge-docker:
    runs-on: ubuntu-latest
    needs:
      [
        codespell,
        super-linter,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
      ]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: knowledge/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/knowledge:latest
          push: ${{ github.event_name != 'pull_request' }}
  backend-test:
    runs-on: ubuntu-latest
    needs:
      [
        codespell,
        super-linter,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: success()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - run: |
          cd backend
          echo "Running tests with coverage collection..."

          # Run tests with coverage for each testable package
          echo "Testing token package..."
          go test -gcflags="all=-N -l" -coverprofile=token.out -covermode=atomic ./token/...

          echo "Testing encoder package..."
          go test -gcflags="all=-N -l" -coverprofile=encoder.out -covermode=atomic ./encoder/...

          echo "Testing handler/middleware package..."
          go test -gcflags="all=-N -l" -coverprofile=middleware.out -covermode=atomic ./handler/middleware/...

          echo "Testing llm package..."
          go list ./llm/... | grep -v /llm/prompt | xargs go test -gcflags="all=-N -l" -coverprofile=llm.out -covermode=atomic

          echo "Testing model package..."
          go test -gcflags="all=-N -l" -coverprofile=model.out -covermode=atomic ./model/...

          echo "All tests passed!"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: backend/*.out
          retention-days: 1
  backend-coverage:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: success()
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - name: Download coverage artifacts
        uses: actions/download-artifact@v6
        with:
          name: coverage-reports
          path: backend
      - run: |
          cd backend
          echo "Verifying coverage requirements (>= 90%)..."

          # Function to check coverage percentage
          check_coverage() {
            local package=$1
            local file=$2
            if [ -f "$file" ]; then
              coverage=$(go tool cover -func="$file" | grep total | awk '{print $3}' | sed 's/%//')
              echo "$package: ${coverage}%"
              # Use awk for floating point comparison
              if awk "BEGIN {exit !($coverage >= 90.0)}"; then
                echo "✓ $package passed coverage requirement"
              else
                echo "✗ $package failed coverage requirement: ${coverage}% < 90%"
                exit 1
              fi
            else
              echo "✗ Coverage file not found: $file"
              exit 1
            fi
          }

          check_coverage "token" "token.out"
          check_coverage "encoder" "encoder.out"
          check_coverage "middleware" "middleware.out"
          check_coverage "llm" "llm.out"
          check_coverage "model" "model.out"

          echo ""
          echo "All packages meet 90% coverage requirement!"
  backend-docker:
    runs-on: ubuntu-latest
    needs: [backend-coverage]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/backend:latest
          push: ${{ github.event_name != 'pull_request' }}
