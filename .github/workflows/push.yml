---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  # push: null
  # pull_request: null

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

env:
  DOCKER_PLATFORMS: linux/arm64

jobs:
  # super-linter:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     statuses: write
  #   steps:
  #     - uses: actions/checkout@v6
  #       with:
  #         fetch-depth: 0
  #         persist-credentials: false
  #     - run: mv -vf .github/linters/* ./
  #     - uses: super-linter/super-linter/slim@2bdd90ed3262e023ac84bf8fe35dc480721fc1f2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
  #         VALIDATE_GO: false
  gofumpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          if gofumpt -l -e backend knowledge | grep '^' -q; then exit 1; fi
  go-channel-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'make\(chan\s')" = "$(grep -Erc --include='*.go' --exclude-dir=".git*" '\sclose\(')"
  go-http-body-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -rc --include='*.go' --exclude-dir=".git*" 'http.Get(\|http.Head(\|http.DefaultClient.Do(')" = "$(grep -rc --include='*.go' --exclude-dir=".git*" '.Body.Close()')"
  go-mockey-unpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: test "$(grep -cr --include='*.go' 'mockey.Mock(')" = "$(grep -cr --include='*.go' '\.UnPatch()$')"
  go-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd backend
          go generate
          git diff --exit-code
  dart-build-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code
  flutter-l10n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter gen-l10n
          git diff --exit-code
  flutter-build-apk:
    runs-on: ubuntu-latest
    needs: [dart-build-runner]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
      - run: |
          echo "${{ secrets.APK_KEYSTORE }}" | base64 -d > app/android/app/vigor-release.jks
          cat <<EOF > app/android/key.properties
          storePassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyAlias=vigor-release
          storeFile=../app/vigor-release.jks
          EOF
      - run: |
          cd app
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
  app-docker:
    runs-on: ubuntu-latest
    # needs: [flutter-build]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: app
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/app:latest
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
  knowledge-docker:
    runs-on: ubuntu-latest
    needs:
      [
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
      ]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: changes
        with:
          filters: |
            knowledge:
              - 'knowledge/**'
              - 'backend/model/**'
              - 'backend/llm/embedding/**'
              - 'backend/llm/rag/**'
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        if: steps.changes.outputs.knowledge == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.changes.outputs.knowledge == 'true'
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        if: steps.changes.outputs.knowledge == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        if: steps.changes.outputs.knowledge == 'true'
        with:
          context: .
          file: knowledge/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/knowledge:latest
          push: true
          build-args: |
            OPENROUTER_EMBEDDING_MODELS=google/gemini-embedding-001
          secrets: |
            openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}
