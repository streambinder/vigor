---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push: null

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

env:
  DOCKER_PLATFORMS: linux/arm64

jobs:
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ln -sv .github/linters/commitlint.config.js ./
      - uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_JSCPD: false
          VALIDATE_JAVASCRIPT_ES: false
          # Go/Dart validated by dedicated jobs in this workflow
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_DART: false
          # cpplint is overly strict for the iOS bridging header (whitespace
          # rules conflict with clang-format output)
          VALIDATE_CPP: false
          # editorconfig-checker conflicts with Xcode/Android-managed files
          VALIDATE_EDITORCONFIG: false

  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      app: ${{ steps.filter.outputs.app }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            go:
              - 'backend/**'
              - 'cockpit/**'
              - 'knowledge/**'
            app:
              - 'app/**'
            knowledge:
              - 'knowledge/**'
              - 'backend/model/**'
              - 'backend/llm/embedding/**'
              - 'backend/llm/rag/**'
            cockpit:
              - 'cockpit/**'

  gofumpt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          gofumpt -e -d backend cockpit knowledge

  go-channel-closure:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'make\(chan\s')" = "$(grep -Erc --include='*.go' --exclude-dir=".git*" '\sclose\(')"

  go-http-body-closure:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'http\.(Get|Head)\(|http\.DefaultClient\.Do\(|client\.(Get|Head|Do)\(')" = "$(grep -rc --include='*.go' --exclude-dir=".git*" '\.Body\.Close()')"

  go-mockey-unpatch:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: test "$(grep -cr --include='*.go' 'mockey.Mock(')" = "$(grep -cr --include='*.go' '\.UnPatch()$')"

  go-generate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            backend/go.sum
            cockpit/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app && flutter pub get
          cd ../backend && go generate
          cd ../cockpit && go generate
          git diff --exit-code

  dart-build-runner:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code

  flutter-l10n:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter gen-l10n
          git diff --exit-code

  flutter-analyze:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter analyze

  app-apk:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          echo "${{ secrets.APK_KEYSTORE }}" | base64 -d > app/android/app/vigor-release.jks
          cat <<EOF > app/android/key.properties
          storePassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyAlias=vigor-release
          storeFile=../app/vigor-release.jks
          EOF
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  app-docker:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: app
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/app:latest
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  knowledge-docker:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.knowledge == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: knowledge/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/knowledge:latest
          push: true
          build-args: |
            OPENROUTER_EMBEDDING_MODELS=google/gemini-embedding-001
          secrets: |
            openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}

  backend-docker:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.go == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/backend:latest
          push: ${{ github.event_name != 'pull_request' }}

  cockpit-docker:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.cockpit == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: cockpit/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/streambinder/vigor/cockpit:latest
          push: ${{ github.event_name != 'pull_request' }}
