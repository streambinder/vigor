---
name: push

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: codespell-project/actions-codespell@406322ec52dd7b488e48c1c4b82e2a8b3a1bf630
        with:
          check_filenames: true
          ignore_words_list: equipments
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/* ./
      - uses: super-linter/super-linter/slim@2bdd90ed3262e023ac84bf8fe35dc480721fc1f2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_GO: false
  gofumpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: server/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          if gofumpt -l -e server exercisedb | grep '^' -q; then exit 1; fi
  go-channel-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'make\(chan\s')" = "$(grep -Erc --include='*.go' --exclude-dir=".git*" '\sclose\(')"
  go-http-body-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: test "$(grep -rc --include='*.go' --exclude-dir=".git*" 'http.Get(\|http.Head(\|http.DefaultClient.Do(')" = "$(grep -rc --include='*.go' --exclude-dir=".git*" '.Body.Close()')"
  go-mockey-unpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: test "$(grep -cr --include='*.go' 'mockey.Mock(')" = "$(grep -cr --include='*.go' '\.UnPatch()$')"
  qtpl-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: server/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install github.com/valyala/quicktemplate/qtc@latest
          cd server/llm/prompt
          qtc
          if git diff --exit-code -- ./*.qtpl.go; then
            echo "Generated qtpl files match repository"
          else
            echo "ERROR: Generated qtpl files differ from repository. Please run 'qtc' in server/llm/prompt and commit the changes."
            exit 1
          fi
  docker-exercisedb:
    runs-on: ubuntu-latest
    needs:
      [
        codespell,
        super-linter,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        qtpl-generation,
      ]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: exercisedb
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: ghcr.io/streambinder/vigor/exercisedb:latest
          push: ${{ github.event_name != 'pull_request' }}
  test:
    runs-on: ubuntu-latest
    needs:
      [
        codespell,
        super-linter,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        qtpl-generation,
      ]
    if: success()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: server/go.sum
      - run: |
          cd server
          echo "Running tests with coverage collection..."

          # Run tests with coverage for each testable package
          echo "Testing token package..."
          go test -gcflags="all=-N -l" -coverprofile=token.out -covermode=atomic ./token/...

          echo "Testing encoder package..."
          go test -gcflags="all=-N -l" -coverprofile=encoder.out -covermode=atomic ./encoder/...

          echo "Testing handler/middleware package..."
          go test -gcflags="all=-N -l" -coverprofile=middleware.out -covermode=atomic ./handler/middleware/...

          echo "Testing llm package..."
          go list ./llm/... | grep -v /llm/prompt | xargs go test -gcflags="all=-N -l" -coverprofile=llm.out -covermode=atomic

          echo "Testing model package..."
          go test -gcflags="all=-N -l" -coverprofile=model.out -covermode=atomic ./model/...

          echo "All tests passed!"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: server/*.out
          retention-days: 1
  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    if: success()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: server/go.sum
      - name: Download coverage artifacts
        uses: actions/download-artifact@v6
        with:
          name: coverage-reports
          path: server
      - run: |
          cd server
          echo "Verifying coverage requirements (>= 90%)..."

          # Function to check coverage percentage
          check_coverage() {
            local package=$1
            local file=$2
            if [ -f "$file" ]; then
              coverage=$(go tool cover -func="$file" | grep total | awk '{print $3}' | sed 's/%//')
              echo "$package: ${coverage}%"
              # Use awk for floating point comparison
              if awk "BEGIN {exit !($coverage >= 90.0)}"; then
                echo "✓ $package passed coverage requirement"
              else
                echo "✗ $package failed coverage requirement: ${coverage}% < 90%"
                exit 1
              fi
            else
              echo "✗ Coverage file not found: $file"
              exit 1
            fi
          }

          check_coverage "token" "token.out"
          check_coverage "encoder" "encoder.out"
          check_coverage "middleware" "middleware.out"
          check_coverage "llm" "llm.out"
          check_coverage "model" "model.out"

          echo ""
          echo "All packages meet 90% coverage requirement!"
  docker-server:
    runs-on: ubuntu-latest
    needs: [coverage]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: ghcr.io/streambinder/vigor:latest
          push: ${{ github.event_name != 'pull_request' }}
