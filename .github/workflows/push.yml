name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

env:
  DOCKER_PLATFORMS: linux/arm64

jobs:
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/commitlint.config.mjs .github/linters/biome.json .github/linters/.trivyignore ./
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_JSCPD: false
          # Go/Dart validated by dedicated jobs in this workflow
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_DART: false
          # cpplint is overly strict for iOS bridging header (whitespace
          # rules conflict with clang-format output)
          VALIDATE_CPP: false
          # editorconfig-checker conflicts with Xcode/Android-managed files
          VALIDATE_EDITORCONFIG: false
          SAVE_SUPER_LINTER_OUTPUT: false
          MULTI_STATUS: false
          LOG_LEVEL: WARN

  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      app: ${{ steps.filter.outputs.app }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      # workaround: dorny/paths-filter#240 — force pushes break paths-filter
      - id: parent
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            go:
              - 'backend/**'
              - 'cockpit/**'
              - 'knowledge/**'
            app:
              - 'app/**'
            knowledge:
              - 'knowledge/**'
              - 'backend/model/**'
              - 'backend/llm/embedding/**'
              - 'backend/llm/rag/**'
            cockpit:
              - 'cockpit/**'

  gofumpt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          gofumpt -e -d backend cockpit knowledge

  golangci-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          working-directory: backend
          args: --enable-only bodyclose -c ../.github/linters/.golangci.yml

  go-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -timeout 300s ./...
        working-directory: backend

  go-generate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            backend/go.sum
            cockpit/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: |
          cd app && flutter pub get
          cd ../backend && go generate
          cd ../cockpit && go generate
          git diff --exit-code

  dart-build-runner:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

  flutter-l10n:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: |
          cd app
          flutter pub get
          flutter gen-l10n
          git diff --exit-code

  flutter-analyze:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze

  app-apk:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: |
          echo "${{ secrets.APK_KEYSTORE }}" | base64 -d > app/android/app/vigor-release.jks
          cat <<EOF > app/android/key.properties
          storePassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyAlias=vigor-release
          storeFile=../app/vigor-release.jks
          EOF
      - run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  app-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set docker tags (app)
        id: tags-app
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            {
              echo "tags<<EOF"
              echo "ghcr.io/$REPOSITORY/app:latest"
              echo "ghcr.io/$REPOSITORY/app:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$REPOSITORY/app:$SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: app
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: ${{ steps.tags-app.outputs.tags }}
          push: true
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  knowledge-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs: [super-linter, changes, gofumpt, golangci-lint, go-test, go-generate]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.knowledge == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.golangci-lint.result == 'success' || needs.golangci-lint.result == 'skipped') &&
      (needs.go-test.result == 'success' || needs.go-test.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set docker tags (knowledge)
        id: tags-knowledge
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            {
              echo "tags<<EOF"
              echo "ghcr.io/$REPOSITORY/knowledge:latest"
              echo "ghcr.io/$REPOSITORY/knowledge:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$REPOSITORY/knowledge:$SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: knowledge/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=knowledge
          cache-to: type=gha,scope=knowledge,mode=max
          tags: ${{ steps.tags-knowledge.outputs.tags }}
          push: true
          build-args: |
            OPENROUTER_EMBEDDING_MODELS=google/gemini-embedding-001
          secrets: |
            openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}

  backend-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs: [super-linter, changes, gofumpt, golangci-lint, go-test, go-generate]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.go == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.golangci-lint.result == 'success' || needs.golangci-lint.result == 'skipped') &&
      (needs.go-test.result == 'success' || needs.go-test.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set docker tags (backend)
        id: tags-backend
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            {
              echo "tags<<EOF"
              echo "ghcr.io/$REPOSITORY/backend:latest"
              echo "ghcr.io/$REPOSITORY/backend:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$REPOSITORY/backend:$SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: ${{ steps.tags-backend.outputs.tags }}
          push: true

  cockpit-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs: [super-linter, changes, gofumpt, golangci-lint, go-test, go-generate]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.cockpit == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.golangci-lint.result == 'success' || needs.golangci-lint.result == 'skipped') &&
      (needs.go-test.result == 'success' || needs.go-test.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set docker tags (cockpit)
        id: tags-cockpit
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            {
              echo "tags<<EOF"
              echo "ghcr.io/$REPOSITORY/cockpit:latest"
              echo "ghcr.io/$REPOSITORY/cockpit:$SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$REPOSITORY/cockpit:$SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: cockpit/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=cockpit
          cache-to: type=gha,scope=cockpit,mode=max
          tags: ${{ steps.tags-cockpit.outputs.tags }}
          push: true
