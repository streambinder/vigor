---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

env:
  DOCKER_PLATFORMS: linux/arm64

jobs:
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/commitlint.config.mjs .github/linters/biome.json .github/linters/.trivyignore ./
      - uses: super-linter/super-linter/slim@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_JSCPD: false
          # Go/Dart validated by dedicated jobs in this workflow
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_DART: false
          # cpplint is overly strict for iOS bridging header (whitespace
          # rules conflict with clang-format output)
          VALIDATE_CPP: false
          # editorconfig-checker conflicts with Xcode/Android-managed files
          VALIDATE_EDITORCONFIG: false
          SAVE_SUPER_LINTER_OUTPUT: false
          MULTI_STATUS: false
          LOG_LEVEL: WARN

  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      app: ${{ steps.filter.outputs.app }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false
      # workaround: dorny/paths-filter#240 — force pushes break paths-filter
      - id: parent
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            go:
              - 'backend/**'
              - 'cockpit/**'
              - 'knowledge/**'
            app:
              - 'app/**'
            knowledge:
              - 'knowledge/**'
              - 'backend/model/**'
              - 'backend/llm/embedding/**'
              - 'backend/llm/rag/**'
            cockpit:
              - 'cockpit/**'

  gofumpt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - run: |
          PATH="$PATH:$(go env GOPATH)/bin"
          export PATH
          go install mvdan.cc/gofumpt@latest
          gofumpt -e -d backend cockpit knowledge

  go-channel-closure:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'make\(chan\s')" = "$(grep -Erc --include='*.go' --exclude-dir=".git*" '\sclose\(')"

  go-http-body-closure:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: test "$(grep -Erc --include='*.go' --exclude-dir=".git*" 'http\.(Get|Head)\(|http\.DefaultClient\.Do\(|client\.(Get|Head|Do)\(')" = "$(grep -rc --include='*.go' --exclude-dir=".git*" '\.Body\.Close()')"

  go-mockey-unpatch:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: test "$(grep -cr --include='*.go' 'mockey.Mock(')" = "$(grep -cr --include='*.go' '\.UnPatch()$')"

  go-generate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            backend/go.sum
            cockpit/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app && flutter pub get
          cd ../backend && go generate
          cd ../cockpit && go generate
          git diff --exit-code

  dart-build-runner:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          git diff --exit-code

  flutter-l10n:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter gen-l10n
          git diff --exit-code

  flutter-analyze:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter analyze

  app-apk:
    runs-on: ubuntu-latest
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: |
          echo "${{ secrets.APK_KEYSTORE }}" | base64 -d > app/android/app/vigor-release.jks
          cat <<EOF > app/android/key.properties
          storePassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyAlias=vigor-release
          storeFile=../app/vigor-release.jks
          EOF
      - run: |
          cd app
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  app-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        go-generate,
        dart-build-runner,
        flutter-l10n,
        flutter-analyze,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.app == 'true' &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      needs.dart-build-runner.result == 'success' &&
      needs.flutter-l10n.result == 'success' &&
      needs.flutter-analyze.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: app
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/app:latest
            ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  knowledge-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.knowledge == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: knowledge/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=knowledge
          cache-to: type=gha,scope=knowledge,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/knowledge:latest
            ghcr.io/${{ github.repository }}/knowledge:${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            OPENROUTER_EMBEDDING_MODELS=google/gemini-embedding-001
          secrets: |
            openrouter_api_key=${{ secrets.OPENROUTER_API_KEY }}

  backend-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.go == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}

  cockpit-docker:
    runs-on: ubuntu-24.04-arm
    environment: deploy
    needs:
      [
        super-linter,
        changes,
        gofumpt,
        go-channel-closure,
        go-http-body-closure,
        go-mockey-unpatch,
        go-generate,
      ]
    if: |
      always() &&
      needs.super-linter.result == 'success' &&
      needs.changes.outputs.cockpit == 'true' &&
      (needs.gofumpt.result == 'success' || needs.gofumpt.result == 'skipped') &&
      (needs.go-channel-closure.result == 'success' || needs.go-channel-closure.result == 'skipped') &&
      (needs.go-http-body-closure.result == 'success' || needs.go-http-body-closure.result == 'skipped') &&
      (needs.go-mockey-unpatch.result == 'success' || needs.go-mockey-unpatch.result == 'skipped') &&
      (needs.go-generate.result == 'success' || needs.go-generate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: cockpit/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          cache-from: type=gha,scope=cockpit
          cache-to: type=gha,scope=cockpit,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/cockpit:latest
            ghcr.io/${{ github.repository }}/cockpit:${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
